<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语词汇记忆 - 六级/考研</title>
<style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #252f3f;
  --border: #334155;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --accent: #38bdf8;
  --accent2: #a78bfa;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 {
  font-size: 1.3rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
header .sub {
  font-size: 0.75rem;
  color: var(--text2);
}

/* Top bar */
.top-bar {
  display: flex;
  gap: 12px;
  padding: 16px 24px;
  flex-wrap: wrap;
  align-items: center;
}
.top-bar input {
  flex: 1;
  min-width: 180px;
  padding: 10px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 0.9rem;
  outline: none;
}
.top-bar input:focus { border-color: var(--accent); }
.top-bar input::placeholder { color: var(--text2); }
.mode-tabs {
  display: flex;
  gap: 4px;
}
.mode-tab {
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  font-size: 0.85rem;
  white-space: nowrap;
  transition: 0.15s;
}
.mode-tab:hover { color: var(--text); border-color: var(--accent); }
.mode-tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; }

/* Stats row */
.stats-row {
  display: flex;
  gap: 10px;
  padding: 0 24px 16px;
  flex-wrap: wrap;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 16px;
  text-align: center;
  min-width: 60px;
  cursor: pointer;
  transition: 0.15s;
  user-select: none;
}
.stat:hover { border-color: var(--accent); transform: translateY(-1px); }
.stat.active { border-color: var(--accent); background: rgba(56,189,248,0.08); }
.stat .n { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
.stat .l { font-size: 0.65rem; color: var(--text2); text-transform: uppercase; }

/* Category tabs */
.cat-tabs {
  display: flex;
  gap: 4px;
  padding: 0 24px 16px;
  flex-wrap: wrap;
}
.cat-tab {
  padding: 6px 14px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  font-size: 0.8rem;
  white-space: nowrap;
  transition: 0.15s;
}
.cat-tab:hover { border-color: var(--accent); color: var(--text); }
.cat-tab.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }

/* Content */
.content { padding: 0 24px 40px; }

/* ===== LIST VIEW ===== */
.group-list { display: flex; flex-direction: column; gap: 8px; }
.group-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.group-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  cursor: pointer;
  user-select: none;
  transition: 0.15s;
}
.group-header:hover { background: var(--surface2); }
.group-header .gname {
  font-weight: 600;
  font-size: 0.95rem;
  flex: 1;
}
.group-header .gcount {
  font-size: 0.75rem;
  color: var(--accent);
  background: rgba(56,189,248,0.1);
  padding: 3px 10px;
  border-radius: 10px;
  white-space: nowrap;
}
.group-header .garrow {
  font-size: 0.7rem;
  color: var(--text2);
  transition: 0.2s;
}
.group-item.open .garrow { transform: rotate(90deg); }
.group-body {
  display: none;
  padding: 0 16px 14px;
  border-top: 1px solid var(--border);
}
.group-item.open .group-body { display: block; }
.group-body .word-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding-top: 12px;
}
.word-tag {
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 0.85rem;
  cursor: pointer;
  transition: 0.15s;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid transparent;
  position: relative;
}
.word-tag:hover { border-color: var(--accent); }
.word-tag .tag-mean {
  display: none;
  font-size: 0.7rem;
  color: var(--accent2);
  margin-left: 6px;
}
.word-tag.show-mean .tag-mean { display: inline; }

/* ===== STUDY VIEW ===== */
.study-setup {
  max-width: 560px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
}
.study-setup h3 { font-size: 1.1rem; margin-bottom: 20px; }
.setup-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.setup-row label {
  font-size: 0.85rem;
  color: var(--text2);
  min-width: 60px;
}
.setup-row select, .setup-row input {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: 0.9rem;
  outline: none;
}
.setup-row select:focus { border-color: var(--accent); }
.cat-checks {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.cat-check {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.8rem;
  color: var(--text2);
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 14px;
  border: 1px solid var(--border);
  transition: 0.15s;
}
.cat-check.checked { border-color: var(--accent); background: rgba(56,189,248,0.1); color: var(--text); }
.cat-check input { display: none; }
.btn {
  padding: 10px 24px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  transition: 0.15s;
}
.btn-go {
  background: var(--accent);
  color: #0f172a;
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  font-size: 1rem;
}
.btn-go:hover { opacity: 0.9; }

/* Study card */
.study-container { max-width: 500px; margin: 0 auto; text-align: center; }
.study-progress {
  height: 6px;
  background: var(--surface);
  border-radius: 3px;
  margin-bottom: 20px;
  overflow: hidden;
}
.study-progress .bar {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: 0.3s;
}
.study-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 20px;
  padding: 50px 30px;
  min-height: 240px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.3s;
  user-select: none;
  position: relative;
}
.study-card:hover { border-color: var(--accent); }
.study-card.flipped { border-color: var(--accent2); }
.study-card .sc-word {
  font-size: 2rem;
  font-weight: 800;
  color: var(--text);
  transition: 0.2s;
}
.study-card .sc-pron {
  font-size: 0.9rem;
  color: var(--text2);
  margin-top: 6px;
}
.study-card .sc-mean {
  font-size: 1.3rem;
  color: var(--accent2);
  font-weight: 600;
  margin-top: 10px;
}
.study-card .sc-group {
  font-size: 0.8rem;
  color: var(--accent);
  margin-top: 6px;
}
.study-card .sc-num {
  position: absolute;
  top: 16px;
  left: 20px;
  font-size: 0.8rem;
  color: var(--text2);
}
.study-card .sc-hint {
  position: absolute;
  bottom: 14px;
  font-size: 0.7rem;
  color: var(--text2);
}
.study-btns {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 20px;
  flex-wrap: wrap;
}
.btn-know {
  background: var(--success);
  color: #000;
  padding: 10px 28px;
}
.btn-unknown {
  background: var(--danger);
  color: #fff;
  padding: 10px 28px;
}
.btn-neutral {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 20px;
}

/* Study results */
.study-results {
  max-width: 560px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  text-align: center;
}
.study-results h3 { margin-bottom: 12px; }
.result-stat {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 16px 0;
}
.result-stat div { text-align: center; }
.result-stat .big { font-size: 2rem; font-weight: 700; }
.result-stat .big.green { color: var(--success); }
.result-stat .big.red { color: var(--danger); }
.unknown-list {
  text-align: left;
  margin-top: 16px;
  max-height: 200px;
  overflow-y: auto;
}
.unknown-list .ul-word {
  display: inline-block;
  padding: 4px 10px;
  margin: 3px;
  border-radius: 4px;
  background: rgba(239,68,68,0.1);
  font-size: 0.85rem;
}

/* Empty */
.empty { text-align: center; padding: 60px 20px; color: var(--text2); }

/* Saved unknown badge */
.saved-badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 10px;
  background: rgba(239,68,68,0.15);
  color: var(--danger);
  font-size: 0.75rem;
  margin-left: 8px;
}

@media (max-width: 600px) {
  .study-card { padding: 30px 16px; min-height: 200px; }
  .study-card .sc-word { font-size: 1.5rem; }
  .cat-tabs { gap: 2px; }
  .cat-tab { padding: 5px 8px; font-size: 0.7rem; }
}
</style>
</head>

// Build flat word list with dedup
function buildAllWords() {
  const seen = new Set();
  const all = [];
  function add(word, cat, group, meaning) {
    const k = word.toLowerCase().trim();
    if (seen.has(k)) return;
    seen.add(k);
    all.push({ word:word.trim(), category:cat, group:group||'', meaning:meaning||'' });
  }
  vocabularyData.synonym.forEach(g => g.words.forEach(w => add(w,'synonym',g.group)));
  vocabularyData.shape.forEach(g => g.words.forEach(w => add(w,'shape',g.group)));
  vocabularyData.connector.forEach(g => g.words.forEach(w => add(w,'connector',g.group)));
  vocabularyData.uncommon.forEach(it => add(it.word,'uncommon','',it.meaning));
  vocabularyData.scene.forEach(g => g.words.forEach(w => add(w,'scene',g.group)));
  vocabularyData.newword.forEach(it => add(it.word,'newword','',it.meaning));
  vocabularyData.phrase.forEach(it => add(it.phrase,'phrase','',it.meaning));
  return all;
}

// Group data for list view
function getGroupedData(cat) {
  if (cat === 'uncommon') {
    return [{ group:'熟词生义', words: vocabularyData.uncommon.map(it => it.word), meanings: vocabularyData.uncommon.map(it => it.meaning) }];
  }
  if (cat === 'newword') {
    return [{ group:'生词汇总', words: vocabularyData.newword.map(it => it.word), meanings: vocabularyData.newword.map(it => it.meaning) }];
  }
  if (cat === 'phrase') {
    return [{ group:'词组', words: vocabularyData.phrase.map(it => it.phrase), meanings: vocabularyData.phrase.map(it => it.meaning) }];
  }
  if (cat === 'connector') return vocabularyData.connector;
  if (cat === 'synonym') return vocabularyData.synonym;
  if (cat === 'shape') return vocabularyData.shape;
  if (cat === 'scene') return vocabularyData.scene;
  return [];
}

function getMeaningFor(word, cat) {
  if (cat === 'uncommon') {
    const found = vocabularyData.uncommon.find(it => it.word.toLowerCase() === word.toLowerCase());
    return found ? found.meaning : '';
  }
  if (cat === 'newword') {
    const found = vocabularyData.newword.find(it => it.word.toLowerCase() === word.toLowerCase());
    return found ? found.meaning : '';
  }
  if (cat === 'phrase') {
    const found = vocabularyData.phrase.find(it => it.phrase.toLowerCase() === word.toLowerCase());
    return found ? found.meaning : '';
  }
  if (cat === 'synonym') {
    for (const g of vocabularyData.synonym) {
      if (g.words.some(w => w.toLowerCase() === word.toLowerCase())) return g.group;
    }
  }
  if (cat === 'shape') {
    for (const g of vocabularyData.shape) {
      if (g.words.some(w => w.toLowerCase() === word.toLowerCase())) return g.group;
    }
  }
  if (cat === 'connector') return '表转折';
  if (cat === 'scene') {
    for (const g of vocabularyData.scene) {
      if (g.words.some(w => w.toLowerCase() === word.toLowerCase())) return g.group;
    }
  }
  return '';
}

    const q = searchQuery.toLowerCase();
    return w.word.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q) || w.group.toLowerCase().includes(q);
  });
}

  cats.forEach(c => {
    const count = allWords.filter(w => w.category === c).length;
    html += `<div class="stat${currentCat===c?' active':''}" data-cat="${c}"><div class="n">${count}</div><div class="l">${catMeta[c].name}</div></div>`;

function renderListView() {
  const filtered = getFilteredWords();

  // Group by category, then by sub-group
  if (currentCat === 'all') {
    // Show all categories as sections
    let html = '';
    const cats = ['synonym','shape','connector','uncommon','scene','newword','phrase'];
    cats.forEach(c => {
      const catWords = filtered.filter(w => w.category === c);
      if (catWords.length === 0) return;
      html += `<div style="margin-bottom:20px">`;
      html += `<h3 style="font-size:1rem;margin-bottom:8px;color:${catMeta[c].color};display:flex;align-items:center;gap:8px;">
        <span style="width:8px;height:8px;border-radius:50%;background:${catMeta[c].color};display:inline-block;"></span>
        ${catMeta[c].name} <span style="font-size:0.75rem;color:var(--text2)">${catWords.length}词</span>
      </h3>`;
      html += renderGroupList(c, catWords);
      html += `</div>`;
    });
    content.innerHTML = html || '<div class="empty">没有匹配的单词</div>';
  } else {
    const catWords = filtered.filter(w => w.category === currentCat);
    if (catWords.length === 0) {
      content.innerHTML = '<div class="empty">没有匹配的单词</div>';
      return;
    }
    let html = `<h3 style="font-size:1rem;margin-bottom:10px;color:${catMeta[currentCat]?.color||'#fff'}">${catMeta[currentCat]?.name||''} · ${catWords.length}词</h3>`;
    html += renderGroupList(currentCat, catWords);
    content.innerHTML = html;
  }

  // Click handlers for group headers
  content.querySelectorAll('.group-header').forEach(h => {
    h.addEventListener('click', () => {
      h.parentElement.classList.toggle('open');
    });
  });
  // Click handlers for word tags
  content.querySelectorAll('.word-tag').forEach(t => {
    t.addEventListener('click', (e) => {
      e.stopPropagation();
      t.classList.toggle('show-mean');
      const word = t.dataset.word;
      if (word) speakWord(word);
    });
  });
}

function renderGroupList(cat, words) {
  const groups = getGroupedData(cat);
  let html = '<div class="group-list">';

  groups.forEach(g => {
    let groupWords;
    if (cat === 'uncommon' || cat === 'newword' || cat === 'phrase') {
      groupWords = words.filter(w => g.words.includes(w.word) || g.words.includes(w.phrase));
    } else {
      groupWords = words.filter(w => g.words.includes(w.word));
    }
    if (groupWords.length === 0) return;

    html += `<div class="group-item">`;
    html += `<div class="group-header">`;
    html += `<span class="gname">${g.group}</span>`;
    html += `<span class="gcount">${groupWords.length}词</span>`;
    html += `<span class="garrow">▶</span>`;
    html += `</div>`;
    html += `<div class="group-body"><div class="word-tags">`;

    groupWords.forEach(w => {
      const meaning = w.meaning || getMeaningFor(w.word, cat);
      html += `<span class="word-tag" data-word="${w.word.replace(/"/g,'&quot;')}">${w.word}<span class="tag-mean"> — ${meaning}</span></span>`;
    });

    html += `</div></div></div>`;
  });

  html += '</div>';
  return html;
}

    content.querySelectorAll('.cat-check').forEach(cc => {
      cc.addEventListener('click', (e) => {
        e.preventDefault();
        cc.classList.toggle('checked');
      });
    });
  }

  document.getElementById('btnStartStudy').addEventListener('click', () => {
    let pool;
    if (prefillUnknown) {
      pool = getSavedUnknown();
    } else {
      const selectedCats = [];
      content.querySelectorAll('.cat-check.checked').forEach(cc => selectedCats.push(cc.dataset.cat));
      pool = words.filter(w => selectedCats.includes(w.category));
    }

    if (pool.length === 0) {
      alert('没有可用的单词，请选择分类。');
      return;
    }

    const count = parseInt(document.getElementById('studyCount').value);
    // Shuffle
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    studyCards = count > 0 ? shuffled.slice(0, count) : shuffled;
    studyIndex = 0;
    studyFlipped = false;
    unknownWords = [];
    knownCount = 0;
    studyHistory = [];
    renderStudyCard();
  });
}

function renderStudyCard() {
  if (studyIndex >= studyCards.length) {
    renderStudyResults();
    return;
  }

  const card = studyCards[studyIndex];
  const pct = Math.round((studyIndex / studyCards.length) * 100);
  const meaning = card.meaning || getMeaningFor(card.word, card.category);

  content.innerHTML = `
    <div class="study-container">
      <div class="study-progress"><div class="bar" style="width:${pct}%"></div></div>
      <div style="font-size:0.8rem;color:var(--text2);margin-bottom:10px;">${studyIndex + 1} / ${studyCards.length}</div>
      <div class="study-card ${studyFlipped?'flipped':''}" id="studyCard">
        <div class="sc-num">${studyIndex + 1}/${studyCards.length}</div>
        <div class="sc-word">${card.word}</div>
        ${studyFlipped ? `
          <div class="sc-mean">${meaning || card.group}</div>
          ${card.group ? `<div class="sc-group">${card.group}</div>` : ''}
        ` : `
          <div class="sc-pron">点击翻转查看释义</div>
        `}
        <div class="sc-hint">Space 翻转 | Home/← 不认识 | End/→ 认识 | ↑ 上一个</div>
      </div>
      <div class="study-btns">
        <button class="btn btn-neutral" id="btnPrev" ${studyIndex === 0 ? 'disabled style="opacity:0.4;cursor:not-allowed"' : ''}>上一个</button>
        <button class="btn btn-unknown" id="btnUnknown">不认识</button>
        <button class="btn btn-know" id="btnKnow">认识</button>
      </div>
    </div>`;

  document.getElementById('studyCard').addEventListener('click', () => {
    studyFlipped = true;
    renderStudyCard();
  });

  document.getElementById('btnKnow').addEventListener('click', () => {
    studyHistory[studyIndex] = 'known';
    knownCount++;
    studyIndex++;
    studyFlipped = false;
    renderStudyCard();
  });

  document.getElementById('btnUnknown').addEventListener('click', () => {
    studyHistory[studyIndex] = 'unknown';
    unknownWords.push({
      word: card.word,
      meaning: meaning,
      group: card.group,
      category: card.category
    });
    studyIndex++;
    studyFlipped = false;
    renderStudyCard();
  });

  document.getElementById('btnPrev').addEventListener('click', () => {
    goToPreviousCard();
  });

  // Keyboard: Space=翻转, Left/Home=不认识, Right/End=认识
  if (currentKh) document.removeEventListener('keydown', currentKh);
  const kh = (e) => {
    if (currentMode !== 'study') { document.removeEventListener('keydown', kh); currentKh = null; return; }
    if (e.key === ' ') {
      e.preventDefault();
      studyFlipped = !studyFlipped;
      renderStudyCard();
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'Home') {
      e.preventDefault();
      if (!studyFlipped) { studyFlipped = true; renderStudyCard(); }
      else { const btn = document.getElementById('btnUnknown'); if (btn) btn.click(); }
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'End') {
      e.preventDefault();
      if (!studyFlipped) { studyFlipped = true; renderStudyCard(); }
      else { const btn = document.getElementById('btnKnow'); if (btn) btn.click(); }
      return;
    }
    if (e.key === 'ArrowUp' || e.key === 'Backspace') {
      e.preventDefault();
      goToPreviousCard();
      return;
    }
  };
  document.addEventListener('keydown', kh);
  currentKh = kh;
}

function goToPreviousCard() {
  if (studyIndex <= 0) return;
  studyIndex--;
  const prevAction = studyHistory[studyIndex];
  if (prevAction === 'known') {
    knownCount--;
  } else if (prevAction === 'unknown') {
    unknownWords.pop();
  }
  studyHistory[studyIndex] = undefined;
  studyFlipped = false;
  renderStudyCard();
}

function renderStudyResults() {
  const total = studyCards.length;
  const unknownCount = unknownWords.length;

  // Save unknown words to localStorage, merge with existing
  if (unknownWords.length > 0) {
    const existing = getSavedUnknown();
    const existingKeys = new Set(existing.map(w => w.word.toLowerCase()));
    const newOnes = unknownWords.filter(w => !existingKeys.has(w.word.toLowerCase()));
    if (newOnes.length > 0) {
      saveUnknown([...existing, ...newOnes]);
    }
  }

  const saved = getSavedUnknown();

  let html = `<div class="study-results">`;
  html += `<h3>本轮完成</h3>`;
  html += `<div class="result-stat">
    <div><div class="big green">${knownCount}</div><div style="font-size:0.8rem;color:var(--text2)">认识</div></div>
    <div><div class="big red">${unknownCount}</div><div style="font-size:0.8rem;color:var(--text2)">不认识</div></div>
  </div>`;

  if (unknownWords.length > 0) {
    html += `<div style="font-size:0.85rem;color:var(--text2);margin-top:8px;">本轮不认识的词：</div>`;
    html += `<div class="unknown-list">`;
    unknownWords.forEach(w => {
      html += `<span class="ul-word">${w.word}<span style="color:var(--accent2);margin-left:4px;font-size:0.75rem;">${w.meaning}</span></span>`;
    });
    html += `</div>`;
  }

  html += `<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">`;
  html += `<button class="btn btn-know" onclick="studyCards=[...unknownWords].sort(()=>Math.random()-0.5);studyIndex=0;studyFlipped=false;knownCount=0;unknownWords=[];studyHistory=[];if(studyCards.length===0){alert('没有生词需要复习');return;}renderStudyCard();">仅复习生词 (${unknownCount})</button>`;
  html += `<button class="btn btn-neutral" onclick="renderStudySetup(false)">新的一轮</button>`;
  if (saved.length > 0) {
    html += `<button class="btn btn-neutral" style="border-color:var(--danger);color:var(--danger);" onclick="clearSavedUnknown();renderStudySetup(false)">清空所有生词</button>`;
  }
  html += `<button class="btn btn-neutral" onclick="currentMode='list';renderAll();">返回列表</button>`;
  html += `</div>`;

  if (saved.length > 0) {
    html += `<div style="margin-top:16px;font-size:0.8rem;color:var(--text2);">累计待复习生词: <span style="color:var(--danger);font-weight:600;">${saved.length}</span> 个</div>`;
  }

  html += `</div>`;
  content.innerHTML = html;
}

// ===== HELPERS =====
function speakWord(word) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
}

function renderAll() {
  renderStats();
  renderCatTabs();
  if (currentMode === 'list') {
    renderListView();
  } else {
    renderStudySetup(false);
  }
}

// ===== EVENTS =====
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim();
  renderAll();
});

catTabs.addEventListener('click', e => {
  const btn = e.target.closest('.cat-tab');
  if (!btn) return;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  renderAll();
});

statsRow.addEventListener('click', e => {
  const stat = e.target.closest('.stat');
  if (!stat) return;
  const cat = stat.dataset.cat;
  if (!cat) return;
  if (cat === 'saved') {
    // Switch to study mode with saved unknown words
    currentMode = 'study';
    document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
    document.querySelector('.mode-tab[data-mode="study"]')?.classList.add('active');
    if (currentKh) { document.removeEventListener('keydown', currentKh); currentKh = null; }
    renderStudySetup(true);
    return;
  }
  // Switch to list mode and filter by category
  currentMode = 'list';
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
  document.querySelector('.mode-tab[data-mode="list"]')?.classList.add('active');
  if (currentKh) { document.removeEventListener('keydown', currentKh); currentKh = null; }
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  const targetTab = document.querySelector(`.cat-tab[data-cat="${cat}"]`);
  if (targetTab) targetTab.classList.add('active');
  searchInput.value = '';
  searchQuery = '';
  renderAll();
});

document.querySelector('.mode-tabs').addEventListener('click', e => {
  const btn = e.target.closest('.mode-tab');
  if (!btn) return;
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = btn.dataset.mode;
  if (currentKh) { document.removeEventListener('keydown', currentKh); currentKh = null; }
  renderAll();
});

// Keyboard shortcut for list view - click to show meanings
document.addEventListener('keydown', e => {
  if (currentMode === 'list' && e.key === 'm') {
    document.querySelectorAll('.word-tag').forEach(t => t.classList.toggle('show-mean'));
  }
});

// Init
renderAll();
</script>

</html>
